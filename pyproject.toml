[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-browser-bot"
version = "0.1.0"
description = "AI-powered browser automation built from scratch with Playwright + LLM"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.0",
    "anyio>=3.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "python-dotenv>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12", "black", "ruff", "python-dotenv>=1.0"]

[project.scripts]
ai-bot = "ai_browser_bot.cli:main"

[tool.setuptools.packages.find]
include = ["ai_browser_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
