<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Browser Bot — Viewer</title>
<style>
  :root {
    --bg: #0f1116;
    --panel: #1a1d24;
    --border: #30333a;
    --text: #e6e7ea;
    --muted: #9aa0b2;
    --accent: #4f8bff;
    --danger: #e05252;
    --ok: #3bb34d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; }
  #status {
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  #status.running { color: var(--accent); }
  #status.done { color: var(--ok); }
  #status.error { color: var(--danger); }
  #screenshot {
    max-width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 12px;
    background: var(--panel);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .log-line { padding: 2px 0; border-bottom: 1px solid var(--border); }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
  footer { margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <h1>AI Browser Bot — Live Viewer</h1>
  <span id="status" class="running">loading…</span>
</header>

<img id="screenshot" src="" alt="Latest browser screenshot">

<div id="log"><div class="empty">Waiting for actions…</div></div>

<footer>
  Polls <code>run_state.json</code> every second. Run the bot with <code>--viewer</code>.
</footer>

<script>
  "use strict";
  const POLL_INTERVAL = 1000; // 1 second
  let currentState = null;

  async function fetchState() {
    try {
      // Cache-busting query param forces a fresh fetch every poll.
      const resp = await fetch("run_state.json?t=" + Date.now());
      if (!resp.ok) return;
      const state = await resp.json();
      if (JSON.stringify(state) !== JSON.stringify(currentState)) {
        currentState = state;
        render(state);
      }
    } catch (e) {
      // run_state.json not written yet — keep waiting silently.
    }
  }

  function render(state) {
    // Screenshot with cache-busting query param
    const img = document.getElementById("screenshot");
    const ts = Date.now();
    const src = "screenshot.png?t=" + ts;
    if (img.src !== src) {
      img.src = src;
    }

    // Status
    const statusEl = document.getElementById("status");
    statusEl.textContent = "step " + (state.step || "?") + ": " + (state.status || "unknown");
    statusEl.className = state.status || "running";

    // Action log
    const log = document.getElementById("log");
    if (!state.actions || state.actions.length === 0) {
      log.innerHTML = '<div class="empty">No actions recorded yet.</div>';
    } else {
      log.innerHTML = state.actions
        .map(function (line) {
          return '<div class="log-line">' + escapeHtml(line) + '</div>';
        })
        .join("");
      // Auto-scroll to bottom
      log.scrollTop = log.scrollHeight;
    }
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // Initial fetch + interval
  fetchState();
  setInterval(fetchState, POLL_INTERVAL);
</script>
</body>
</html>
